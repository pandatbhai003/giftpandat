<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA VAULT - Gift Codes</title>
<style>
  :root{
    --bg-1:#0b0c14;
    --bg-2:#151329;
    --accent-1:#7f5af0;
    --accent-2:#2cb67d;
    --accent-glow:#7f5af0;
    --card-bg:#15162a;
    --card-border:rgba(127,90,240,0.25);
    --text-main:#f2f2f7;
    --text-dim:#a8a8b8;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
  }

  body{
    font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(127,90,240,0.25), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(44,182,125,0.2), transparent 45%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    background-attachment:fixed;
    color:var(--text-main);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:48px 16px 80px;
  }

  .page{
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* ===== TITLE / SUBTITLE ===== */
  .title{
    /* EDITABLE: TITLE */
    font-size:clamp(28px, 8vw, 40px);
    font-weight:800;
    letter-spacing:1px;
    background:linear-gradient(90deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 40px rgba(127,90,240,0.35);
  }

  .subtitle{
    /* EDITABLE: SUBTITLE */
    margin-top:8px;
    font-size:14px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--text-dim);
  }

  /* ===== CTA BUTTON ===== */
  .cta-btn{
    /* EDITABLE: CTA TEXT (in HTML below) / CTA URL (href) */
    margin-top:32px;
    display:inline-block;
    text-decoration:none;
    font-weight:700;
    font-size:17px;
    letter-spacing:0.5px;
    color:#0b0c14;
    background:linear-gradient(90deg, var(--accent-2), var(--accent-1));
    padding:16px 44px;
    border-radius:50px;
    box-shadow:0 8px 30px rgba(127,90,240,0.45);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }

  .cta-btn:hover{
    transform:translateY(-3px) scale(1.03);
    box-shadow:0 12px 36px rgba(127,90,240,0.6);
  }

  .cta-btn:active{
    transform:translateY(0) scale(0.97);
  }

  /* ===== GIFT CARDS ===== */
  .cards{
    width:100%;
    margin-top:44px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  .card{
    background:linear-gradient(180deg, var(--card-bg), rgba(21,22,42,0.6));
    border:1px solid var(--card-border);
    border-radius:20px;
    padding:22px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 36px rgba(127,90,240,0.25);
  }

  .card-header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:17px;
    font-weight:700;
    color:var(--text-main);
  }

  .card-header .emoji{
    font-size:22px;
  }

  .card-code{
    margin-top:14px;
    font-family:'Courier New', monospace;
    font-size:clamp(15px, 5vw, 19px);
    font-weight:700;
    letter-spacing:1px;
    background:rgba(255,255,255,0.05);
    border:1px dashed rgba(255,255,255,0.15);
    border-radius:12px;
    padding:12px 10px;
    word-break:break-all;
    color:#e6e6f0;
  }

  .copy-btn{
    margin-top:16px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    font-size:14px;
    font-weight:700;
    letter-spacing:1px;
    cursor:pointer;
    color:#0b0c14;
    background:linear-gradient(90deg, var(--accent-1), var(--accent-2));
    transition:transform 0.12s ease, opacity 0.12s ease;
  }

  .copy-btn:hover{
    opacity:0.92;
  }

  .copy-btn:active{
    transform:scale(0.96);
  }

  .copy-btn.copied{
    background:linear-gradient(90deg, #2cb67d, #2cb67d);
  }

  /* ===== FOOTER ===== */
  footer{
    margin-top:56px;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.5px;
  }

  /* ===== TOAST ===== */
  #toast{
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#1c1d33;
    border:1px solid var(--card-border);
    color:var(--text-main);
    padding:12px 22px;
    border-radius:30px;
    font-size:14px;
    font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:999;
  }

  #toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (min-width:600px){
    .page{ max-width:520px; }
  }
</style>
</head>
<body>

  <div class="page">

    <!-- ============ TITLE / SUBTITLE ============ -->
    <!-- EDITABLE: BRAND NAME / TITLE -->
    <h1 class="title">NOVA VAULT</h1>
    <!-- EDITABLE: SUBTITLE -->
    <p class="subtitle">Exclusive Gift Codes</p>

    <!-- ============ MAIN CTA ============ -->
    <!-- EDITABLE: CTA TEXT + CTA URL -->
    <a href="https://example.com/register" class="cta-btn" target="_blank" rel="noopener">🚀 REGISTER NOW</a>

    <!-- ============ GIFT CARDS ============ -->
    <div class="cards">

      <!-- GIFT CARD 1 -->
      <div class="card">
        <div class="card-header">
          <span class="emoji">🎁</span>
          <!-- EDITABLE: GIFT 1 AMOUNT -->
          <span>₹50 GIFT CODE</span>
        </div>
        <!-- EDITABLE: GIFT 1 CODE -->
        <div class="card-code" id="code-1">YOUR-GIFT-CODE-HERE-1</div>
        <button class="copy-btn" onclick="copyCode('code-1', this)">COPY</button>
      </div>

      <!-- GIFT CARD 2 -->
      <div class="card">
        <div class="card-header">
          <span class="emoji">🎁</span>
          <!-- EDITABLE: GIFT 2 AMOUNT -->
          <span>₹20 GIFT CODE</span>
        </div>
        <!-- EDITABLE: GIFT 2 CODE -->
        <div class="card-code" id="code-2">YOUR-GIFT-CODE-HERE-2</div>
        <button class="copy-btn" onclick="copyCode('code-2', this)">COPY</button>
      </div>

      <!-- GIFT CARD 3 -->
      <div class="card">
        <div class="card-header">
          <span class="emoji">🎁</span>
          <!-- EDITABLE: GIFT 3 AMOUNT -->
          <span>₹90 GIFT CODE</span>
        </div>
        <!-- EDITABLE: GIFT 3 CODE -->
        <div class="card-code" id="code-3">YOUR-GIFT-CODE-HERE-3</div>
        <button class="copy-btn" onclick="copyCode('code-3', this)">COPY</button>
      </div>

    </div>

    <!-- ============ FOOTER ============ -->
    <!-- EDITABLE: BRAND NAME -->
    <footer>© 2026 NOVA VAULT • Gift Code Page</footer>

  </div>

  <div id="toast">Code Copied ✓</div>

  <script>
    function copyCode(codeId, btn) {
      const codeText = document.getElementById(codeId).textContent.trim();

      const finishCopy = () => {
        const originalText = "COPY";
        btn.textContent = "COPIED ✓";
        btn.classList.add("copied");
        showToast();
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove("copied");
        }, 2000);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(codeText).then(finishCopy).catch(() => {
          fallbackCopy(codeText);
          finishCopy();
        });
      } else {
        fallbackCopy(codeText);
        finishCopy();
      }
    }

    function fallbackCopy(text) {
      const temp = document.createElement("textarea");
      temp.value = text;
      temp.style.position = "fixed";
      temp.style.opacity = "0";
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      try {
        document.execCommand("copy");
      } catch (err) {
        console.error("Copy failed", err);
      }
      document.body.removeChild(temp);
    }

    function showToast() {
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => {
        toast.classList.remove("show");
      }, 2000);
    }
  </script>

</body>
</html>
